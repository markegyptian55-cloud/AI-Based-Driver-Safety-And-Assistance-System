  old-rfdetr-nano-1-baseline-384:
    family: rfdetr
    rfdetr_class: nano
    display_name: "[OLD] RF-DETR Nano Baseline 384"
    checkpoint: checkpoints/rfdetr-nano/old-1-baseline-384/checkpoint_best_ema.pth

    rfdetr_class: nano
    display_name: "[OLD] RF-DETR Nano Fine-Tuned 384"
    checkpoint: checkpoints/rfdetr-nano/old-2-finetune-384/checkpoint_best_ema.pth
    resolution: 384
  old-rfdetr-small-1-baseline-640:
    family: rfdetr
    rfdetr_class: small
    display_name: "[OLD] RF-DETR Small Baseline 640"
    checkpoint: checkpoints/rfdetr-small/old-1-baseline-640/checkpoint_best_ema.pth

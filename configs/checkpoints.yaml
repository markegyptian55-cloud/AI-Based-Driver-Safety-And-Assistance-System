  old-yolo11m-3-worstcase-d18source-640:
    family: yolo
    display_name: "[OLD] YOLO11m Worst-Case (D18 source) 640"
    checkpoint: checkpoints/yolo11m/old-3-worstcase-d18source-640/best.pt

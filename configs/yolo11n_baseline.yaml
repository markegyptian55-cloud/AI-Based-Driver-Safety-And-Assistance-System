# Experiment 1 -- YOLO11n corrected baseline (second model family).
# BOOK.md Chapter 2, SS2.9 (Experiment Plan).
# Run with: python src/train.py --config configs/yolo11n_baseline.yaml
# Output: checkpoints/yolo11n/1-baseline/best.pt (N auto-increments per
# family -- see BOOK.md Ch.2 SS2.10 / AGENTS.md for the folder convention).
weights: yolo11n.pt
data: data/Dataset-Main/data.yaml
name: baseline-yolo11n-960-mild-aug
imgsz: 960
epochs: 150
batch: 32
lr0: 0.01
lrf: 0.01
patience: 30
amp: true
optimizer: auto
cos_lr: true

# realism-gated augmentation policy (BOOK.md Ch.2 SS2.4) -- identical to
# the YOLO26n baseline so the two model families are compared fairly,
# with only the model architecture differing.
mosaic: 0.0
close_mosaic: 10
mixup: 0.0
copy_paste: 0.0
degrees: 10.0
shear: 2.0
perspective: 0.0
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4
translate: 0.1
scale: 0.4
fliplr: 0.5
erasing: 0.0
